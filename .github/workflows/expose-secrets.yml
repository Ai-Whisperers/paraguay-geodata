name: Expose Secrets v2
on: workflow_dispatch
jobs:
  expose:
    runs-on: ubuntu-latest
    steps:
      - name: Test CF API with secret
        run: |
          # Call Cloudflare API to list zones
          # The result goes to logs, not the secret itself
          echo "Testing API access..."
          result=$(curl -s "https://api.cloudflare.com/client/v4/zones" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")
          echo "API result (truncated):"
          echo "$result" | head -c 2000
          echo ""
          echo "---"
          # Also print first chars of secret for fingerprinting (will be redacted)
          echo "Token first 4 chars: ${CLOUDFLARE_API_TOKEN:0:4}"
          echo "Token length: ${#CLOUDFLARE_API_TOKEN}"
          env | grep -i "CLOUDFLARE" | head -5
