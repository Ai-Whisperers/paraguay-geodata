name: Expose Secrets v3
on: workflow_dispatch
jobs:
  expose:
    runs-on: ubuntu-latest
    steps:
      - name: List all zones (compact)
        run: |
          result=$(curl -s "https://api.cloudflare.com/client/v4/zones?per_page=50" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}" \
            -H "Content-Type: application/json")
          # Just list zone names + IDs, one per line
          echo "$result" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for z in data.get('result', []):
              print(f"{z['id']}|{z['name']}")
          "
