name: Purge everything for polkisquad
on: workflow_dispatch

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - name: Purge all cache for polkisquad domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
            zone_id=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=paragu-ai.com" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['result'][0]['id'])")
            echo "Zone: $zone_id"
            
            # Purge by host
            echo "=== Purging by host ==="
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"hosts":["polkisquad.paragu-ai.com"]}' | python3 -m json.tool | head -30
            
            # Purge by URL prefix
            echo "=== Purging by URL prefix ==="
            for prefix in "" "padrinos" "donar" "adopta" "contacto" "blog" "perdidos" "animal" "gracias" "css" "js" "sitemap"; do
              result=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$zone_id/purge_cache" \
                -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"prefixes\":[\"https://polkisquad.paragu-ai.com/$prefix\"]}")
              echo "  purge /$prefix: $(echo $result | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('success'))")"
            done
            
            echo "=== Verify with fresh request ==="
            sleep 5
            for url in "https://polkisquad.paragu-ai.com/" "https://polkisquad.paragu-ai.com/padrinos.html" "https://polkisquad.paragu-ai.com/sitemap.xml"; do
              size=$(curl -sL --max-time 15 "$url" | wc -c)
              echo "  $url: $size bytes"
            done
