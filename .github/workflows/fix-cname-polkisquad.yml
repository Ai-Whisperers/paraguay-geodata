name: Cleanup DNS and create CNAME
on: workflow_dispatch

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Fix DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=paragu-ai.com" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"][0]["id"])')
          echo "Zone: $ZONE_ID"
          
          echo "=== Existing records for polkisquad ==="
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=polkisquad.paragu-ai.com" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -m json.tool
          
          echo ""
          echo "=== Deleting ALL records matching polkisquad ==="
          IDS=$(curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=polkisquad.paragu-ai.com" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(" ".join([r["id"] for r in d.get("result", [])]))')
          echo "IDs: $IDS"
          
          for id in $IDS; do
            echo "Deleting $id..."
            curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records/$id" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
            echo ""
          done
          
          echo ""
          echo "=== Creating CNAME ==="
          result=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"CNAME","name":"polkisquad","content":"polkisquad.pages.dev","proxied":true}')
          echo "$result"
          
          echo ""
          echo "=== Final DNS state ==="
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=polkisquad" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -m json.tool
          
          echo ""
          echo "=== Sleep + verify ==="
          sleep 30
          for url in "https://polkisquad.paragu-ai.com/" "https://polkisquad.paragu-ai.com/padrinos.html" "https://polkisquad.paragu-ai.com/sitemap.xml"; do
            size=$(curl -sL --max-time 15 "$url" | wc -c)
            echo "  $url: $size bytes"
          done
