name: Diagnose polkisquad deployment
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: List Pages projects
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
            echo "=== All Pages projects ==="
            curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "
import json, sys
d = json.load(sys.stdin)
for p in d.get('result', []):
    print(f\"  Project: {p['name']}\")
    print(f\"    subdomain: {p.get('subdomain')}\")
    print(f\"    domains: {p.get('custom_domains', [])}\")
"
            
            echo ""
            echo "=== polkisquad-preview project details ==="
            curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/polkisquad-preview" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -m json.tool | head -30
            
            echo ""
            echo "=== polkisquad project details ==="
            curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/polkisquad" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -m json.tool | head -30
            
            echo ""
            echo "=== DNS records ==="
            zone_id=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=paragu-ai.com" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['result'][0]['id'])")
            curl -s "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?type=CNAME&name=polkisquad" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -m json.tool
