name: Debug polkisquad routes
on: workflow_dispatch
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check Pages + DNS state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Pages project polkisquad domains ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/polkisquad/domains" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -m json.tool
          
          echo ""
          echo "=== Pages project polkisquad-preview domains ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/polkisquad-preview/domains" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -m json.tool
          
          echo ""
          echo "=== All DNS records for polkisquad ==="
          zone_id=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=paragu-ai.com" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['id'])")
          curl -s "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=polkisquad" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -m json.tool

          echo ""
          echo "=== Test with curl verbose ==="
          curl -sv "https://polkisquad.paragu-ai.com/" 2>&1 | grep -i "cf-\|location\|host" | head -20
