name: Setup Polki Squad custom domain
on: workflow_dispatch
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Add custom domain to Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # Add polkisquad.paragu-ai.com as custom domain
          echo "Adding custom domain..."
          result=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/polkisquad-preview/domains" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"name":"polkisquad.paragu-ai.com"}')
          echo "$result" | python3 -m json.tool 2>&1 || echo "$result"
          echo "---"

          # Also create the DNS record
          echo "Creating DNS record..."
          # Get the zone ID for paragu-ai.com
          zone_id=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=paragu-ai.com" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['result'][0]['id'])")
          echo "Zone ID: $zone_id"

          # Get the CNAME target (polkisquad-preview.pages.dev)
          # Create the CNAME record
          result=$(curl -s "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"CNAME","name":"polkisquad","content":"polkisquad-preview.pages.dev","proxied":true}')
          echo "$result" | python3 -m json.tool 2>&1 || echo "$result"
          echo "---DONE---"
