name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check tools/ tests/
          ruff format --check tools/ tests/

      - name: Type-check (mypy)
        continue-on-error: true   # mypy is aspirational; allow red 0
        run: |
          mypy tools/ --ignore-missing-imports 2>&1 | tail -30

      - name: Test (pytest)
        run: |
          pytest -q --no-header --cov=tools --cov-report=term-missing --cov-fail-under=20

  deploy-preview:
    # Only runs on PRs and pushes to `feat/*` branches.
    needs: test
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Build canonical artifact
        run: |
          python3 -m tools.canonicalize_properties \
            --input exports/web/data/properties_latest.geojson \
            --output data/properties
          python3 -m tools.merge_fresh_sources || true
          python3 -m tools.build_facets
          python3 -m tools.build_data_freshness
          python3 -m tools.build_days_on_market
      - uses: actions/upload-artifact@v4
        with:
          name: preview-dist
          path: exports/web/

  deploy-prod:
    # Only runs on push to main.
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Deploy preview first
        run: |
          python3 -m tools.canonicalize_properties \
            --input exports/web/data/properties_latest.geojson \
            --output data/properties
          python3 -m tools.merge_fresh_sources || true
          python3 -m tools.build_facets
          python3 -m tools.build_data_freshness
          python3 -m tools.build_days_on_market
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd exports/web
          npx --yes wrangler@latest pages deploy . --project-name paraguay-geodata --branch main --commit-dirty=true
