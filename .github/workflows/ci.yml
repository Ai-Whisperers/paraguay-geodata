name: CI — Paraguay Geodata

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  offline-tests:
    name: Offline test suite (no network)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install playwright + chromium (for hillshade frontend tests)
        run: |
          pip install playwright pytest pytest-cov
          playwright install chromium
      - name: Install project dev deps
        run: pip install -e ".[dev]" || true   # tolerate missing extras
      - name: Run pytest offline suite
        run: |
          python3 -m pytest tests/ -q -m 'not live' --tb=short --no-header \
            --ignore=tests/test_deploy_smoke.py \
            --ignore=tests/test_layer_registry.py \
            --ignore=tests/test_user_features.py \
            --ignore=tests/test_security_headers.py

  schema-and-pii:
    name: Schema + GeoJSON + PII sanity (legacy jobs)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check JSON files parse
        run: |
          python3 -c "
          import json, sys
          from pathlib import Path
          ok = True
          for f in Path('exports/web/data').rglob('*.json'):
              try:
                  json.load(open(f))
              except Exception as e:
                  print(f'BAD {f}: {e}')
                  ok = False
          sys.exit(0 if ok else 1)
          "
      - name: Check GeoJSON files parse + type
        run: |
          python3 -c "
          import json, sys
          from pathlib import Path
          ok = True
          for f in Path('exports/web/data').rglob('*.geojson'):
              try:
                  d = json.load(open(f))
                  if d.get('type') != 'FeatureCollection':
                      print(f'BAD {f}: not a FeatureCollection')
                      ok = False
              except Exception as e:
                  print(f'BAD {f}: {e}')
                  ok = False
          sys.exit(0 if ok else 1)
          "
      - name: Audit PII scrub (full sample, not 500)
        run: |
          python3 -m pytest tests/test_pii_scrub.py::test_live_properties_full_pii_scan -v

  pii-unit:
    name: PII scrub unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run scrub_pii unit suite
        run: python3 -m pytest tests/test_pii_scrub.py -q -m 'not live'

  merge-contract:
    name: merge_property_sources contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run merge contract suite
        run: python3 -m pytest tests/test_merge_property_sources.py -q -m 'not live'

  risk-fairprice:
    name: Property risk + fair-price model schema
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run risk + fair-price suites
        run: |
          python3 -m pytest tests/test_property_risk.py tests/test_fair_price_model.py -v

  hillshade-builders:
    name: Hillshade v3 + priority regression
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run hillshade builder + regression suites
        run: |
          python3 -m pytest tests/test_build_paraguay_hillshade_v3.py tests/test_hillshade_regression.py tests/test_national_tile_index.py tests/test_tile_fabric_regression.py -v

  live-smoke:
    name: Live deploy smoke (slow; runs on push only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Smoke against live base
        run: |
          python3 -m pytest tests/test_deploy_smoke.py tests/test_layer_registry.py tests/test_user_features.py tests/test_security_headers.py -m live -q --tb=short --no-header
        env:
          PY_GEO_BASE_URL: https://geodata.paragu-ai.com
