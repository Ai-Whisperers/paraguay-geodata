name: Force edge refresh
on: workflow_dispatch
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Force edge refresh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "=== Check current domain state ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/polkisquad/domains" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -m json.tool
          
          echo ""
          echo "=== Check latest deployment ==="
          curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/polkisquad" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -m json.tool | grep -A 5 latest_deployment
          
          echo ""
          echo "=== Test with no-cache headers ==="
          curl -sL -o /tmp/test.html -w "%{http_code} %{size_download}" --max-time 20             -H "Cache-Control: no-cache"             -H "Pragma: no-cache"             -k             "https://polkisquad.paragu-ai.com/padrinos.html"
          echo ""
          echo "  Has new content?"
          grep -c 'name="amount"' /tmp/test.html || echo "NO"
