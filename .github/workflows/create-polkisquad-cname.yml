name: Create CNAME for polkisquad
on: workflow_dispatch

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create CNAME
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          zone_id=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=paragu-ai.com" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import json,sys; print(json.load(sys.stdin)['result'][0]['id'])")
          echo "Zone: $zone_id"
          
          # Get the polkisquad Pages project's CNAME target
          target=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/polkisquad" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c "import json,sys; print(json.load(sys.stdin)['result']['subdomain'])")
          echo "Target: $target"
          
          # Delete any existing polkisquad records (cleanup)
          existing=$(curl -s "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=polkisquad.paragu-ai.com" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")
          echo "Existing records: $existing"
          
          echo "$existing" | python3 -c "
import json, sys
d = json.load(sys.stdin)
for r in d.get('result', []):
    print(f\"deleting {r['id']}\")
    import subprocess
    subprocess.run(['curl', '-s', '-X', 'DELETE', f\"https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records/{r['id']}\", '-H', 'Authorization: Bearer ${{ secrets.CLOUDFLARE_API_TOKEN }}'])
          " || true
          
          # Create the CNAME record
          echo ""
          echo "=== Creating CNAME ==="
          result=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" -d "{\"type\":\"CNAME\",\"name\":\"polkisquad\",\"content\":\"$target\",\"proxied\":true}")
          echo "$result" | python3 -m json.tool
          
          echo ""
          echo "=== Final DNS state ==="
          curl -s "https://api.cloudflare.com/client/v4/zones/$zone_id/dns_records?name=polkisquad" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -m json.tool
          
          echo ""
          echo "=== Wait + verify ==="
          sleep 30
          for url in "https://polkisquad.paragu-ai.com/" "https://polkisquad.paragu-ai.com/padrinos.html" "https://polkisquad.paragu-ai.com/sitemap.xml"; do
            size=$(curl -sL --max-time 15 "$url" | wc -c)
            echo "  $url: $size bytes"
          done
