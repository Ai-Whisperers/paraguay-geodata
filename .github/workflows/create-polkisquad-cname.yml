name: Create CNAME for polkisquad
on: workflow_dispatch

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - name: Create CNAME
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          ZONE_ID=$(curl -s "https://api.cloudflare.com/client/v4/zones?name=paragu-ai.com" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | python3 -c 'import json,sys; print(json.load(sys.stdin)["result"][0]["id"])')
          echo "Zone: $ZONE_ID"
          
          TARGET="polkisquad.pages.dev"
          echo "Target: $TARGET"
          
          echo "=== Creating CNAME ==="
          curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"type":"CNAME","name":"polkisquad","content":"polkisquad.pages.dev","proxied":true}'
          echo ""
          echo "=== DNS state ==="
          curl -s "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/dns_records?name=polkisquad" -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN"
