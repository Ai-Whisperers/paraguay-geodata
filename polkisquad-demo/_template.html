<!DOCTYPE html>
<html lang="es-PY">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{TITLE}</title>
    <link rel="icon" type="image/svg+xml" href="{FAVICON}">
    <link rel="manifest" href="{MANIFEST}">
    <meta name="theme-color" content="#FF6B35">
    <link rel="canonical" href="{CANONICAL}">
    {META_TAGS}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{STYLES}">
    {EXTRA_CSS}
    {JSON_LD}
</head>
<body>
    <a href="#main" class="skip-link">Saltar al contenido principal</a>
    {DEMO_BANNER}
    <header class="header">
        <div class="container header__inner">
            <a href="{HOME}" class="logo">
                <span class="logo__mark">🐾</span>
                <span class="logo__text">Polki Squad</span>
            </a>
            <nav class="nav" aria-label="Navegación principal">
                {NAV_ITEMS}
            </nav>
            <a href="https://wa.me/595971771371" class="btn btn--primary btn--small">WhatsApp</a>
        </div>
    </header>
    <main id="main">
        {MAIN_CONTENT}
    </main>
    <footer class="footer">
        {FOOTER_CONTENT}
    </footer>
    <button id="back-to-top" class="back-to-top" aria-label="Volver arriba" type="button">↑</button>
    {OUTREACH_CTA}
    {SCRIPTS}
</body>
</html>
