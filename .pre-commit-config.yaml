# Pre-commit hooks — run `pre-commit install` to enable.
# https://pre-commit.com/

minimum_pre_commit_version: "3.0"

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.4
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: forbid-newline-at-end-of-file
      - id: check-added-large-files
        args: ["--maxkb=500", "--enforce-all"]

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
              .*\.geojson|
              .*\.json|
              tests/fixtures/.*|
              data/properties/.*|
              exports/web/data/.*|
              docs/operations/AUDIT-.*\.json
          )$

  - repo: local
    hooks:
      - id: pytest-fast
        name: pytest (fast, non-live)
        entry: python3 -m pytest tests/ -q --no-header -m "not live"
        language: system
        pass_filenames: false
        types: [python]
